[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bloodmusic"
version = "2.0.0"
description = "程序化游戏音频合成引擎"
requires-python = ">=3.10"
authors = [
    { name = "siwpan" },
]
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "mido>=1.3,<2.0",
]

[project.optional-dependencies]
gui = ["tkinter"]

[project.scripts]
bloodmusic = "bloodmusic.cli:main"

[tool.setuptools]
packages = [
    "bloodmusic", "core", "effects", "music", "sfx", "export", "playback", "gui",
    "bridge", "album_maker", "pipeline", "interactive", "autowav", "mirror",
]

[tool.setuptools.package-dir]
bloodmusic = "."
core = "core"
effects = "effects"
music = "music"
sfx = "sfx"
export = "export"
playback = "playback"
gui = "gui"
bridge = "bridge"
album_maker = "album_maker"
pipeline = "pipeline"
interactive = "interactive"
autowav = "autowav"
mirror = "mirror"

[tool.pytest.ini_options]
testpaths = ["tests", "album_maker/tests"]
# 注意: games/zhuangtaiji/test 下是独立验证脚本（python test_verify.py 直接运行，非 pytest 用例），
# 放入 testpaths 会在收集时执行模块级代码并替换 sys.stdout，破坏 pytest 捕获，故排除。
# 注意: pipeline/tests 使用扁平模块 sys.path 注入，与主套件合并收集会冲突，需单独运行:
#   python -m pytest pipeline/tests/
markers = [
    "slow: marks tests as slow (deselect with '-k \"not slow\"')",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
