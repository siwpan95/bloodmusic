[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bloodmusic"
version = "2.0.0"
description = "程序化游戏音频合成引擎"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "siwpan" },
]
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "mido>=1.3,<2.0",
]

[project.optional-dependencies]
gui = ["tkinter"]

[project.scripts]
bloodmusic = "bloodmusic.cli:main"

[tool.setuptools]
packages = [
    "bloodmusic",
    "bloodmusic.core", "bloodmusic.effects", "bloodmusic.music", "bloodmusic.sfx",
    "bloodmusic.export", "bloodmusic.playback", "bloodmusic.gui", "bloodmusic.bridge",
    "bloodmusic.album_maker", "bloodmusic.pipeline", "bloodmusic.interactive",
    "bloodmusic.autowav", "bloodmusic.mirror",
]
py-modules = []

# 仓库根即包根（目录名 bloodmusic，与包名一致），子包用 package-dir 逐个映射
# 把各子包映射进 bloodmusic 命名空间；否则安装后会在 site-packages 顶层留下
# core/ music/ export/ gui/ pipeline/ mirror/ 等通用名，与其它包冲突。
[tool.setuptools.package-dir]
bloodmusic = "."
"bloodmusic.core" = "core"
"bloodmusic.effects" = "effects"
"bloodmusic.music" = "music"
"bloodmusic.sfx" = "sfx"
"bloodmusic.export" = "export"
"bloodmusic.playback" = "playback"
"bloodmusic.gui" = "gui"
"bloodmusic.bridge" = "bridge"
"bloodmusic.album_maker" = "album_maker"
"bloodmusic.pipeline" = "pipeline"
"bloodmusic.interactive" = "interactive"
"bloodmusic.autowav" = "autowav"
"bloodmusic.mirror" = "mirror"

[tool.pytest.ini_options]
testpaths = ["tests", "album_maker/tests"]
# 注意: games/zhuangtaiji/test 下是独立验证脚本（python test_verify.py 直接运行，非 pytest 用例），
# 放入 testpaths 会在收集时执行模块级代码并替换 sys.stdout，破坏 pytest 捕获，故排除。
# 注意: pipeline/tests 使用扁平模块 sys.path 注入，与主套件合并收集会冲突，需单独运行:
#   python -m pytest pipeline/tests/
markers = [
    "slow: marks tests as slow (deselect with '-k \"not slow\"')",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
