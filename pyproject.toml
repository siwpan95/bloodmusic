[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bloodmusic"
version = "2.0.0"
description = "程序化游戏音频合成引擎"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
]

[project.optional-dependencies]
gui = ["tkinter"]

[project.scripts]
bloodmusic = "bloodmusic.cli:main"

[tool.setuptools]
packages = ["bloodmusic", "core", "effects", "music", "sfx", "export", "playback", "gui"]

[tool.setuptools.package-dir]
bloodmusic = "."
core = "core"
effects = "effects"
music = "music"
sfx = "sfx"
export = "export"
playback = "playback"
gui = "gui"

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-k \"not slow\"')",
]
