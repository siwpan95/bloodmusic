name: "午夜摇摆 — 爵士/摇摆"
version: "1.0"
bpm: 100
key: "Eb"
scale: "major"
style: jazz

instruments:
  - name: "Jazz Guitar"
    role: melody
    engine: karplus_strong
    preset: "guitar"
    volume: 0.75
    pan: 0.2
    effect_chain:
      reverb_mix: 0.15
      reverb_decay: 0.8
      lp_filter_hz: 4000

  - name: "Jazz Organ"
    role: chord
    engine: fm_advanced
    preset: "organ"
    volume: 0.55
    pan: -0.2
    effect_chain:
      reverb_mix: 0.2
      lp_filter_hz: 3500

  - name: "Walking Bass"
    role: bass
    engine: subtractive
    preset: "acoustic_bass"
    volume: 0.75
    pan: 0.0
    octave: -1
    effect_chain:
      lp_filter_hz: 800

  - name: "Brush Kit"
    role: drum
    engine: noise
    volume: 0.60
    pan: 0.0

generation:
  diversity: 0.3
  humanize: true
  chord_progression: "jazz"
