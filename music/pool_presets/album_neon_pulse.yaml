name: "霓虹脉冲 — 电子/EDM"
version: "1.0"
bpm: 128
key: "C"
scale: "minor"
style: battle

instruments:
  - name: "Neon Lead"
    role: melody
    engine: subtractive
    preset: "square_lead"
    volume: 0.75
    pan: 0.0
    effect_chain:
      lp_filter_hz: 8000

  - name: "EDM Pad"
    role: chord
    engine: subtractive
    preset: "saw_pad"
    volume: 0.55
    pan: 0.3
    effect_chain:
      reverb_mix: 0.3
      lp_filter_hz: 6000

  - name: "Acid Bass"
    role: bass
    engine: fm
    preset: "fm_bass"
    volume: 0.80
    pan: 0.0
    octave: -1
    effect_chain:
      lp_filter_hz: 1500

  - name: "EDM Kit"
    role: drum
    engine: noise
    volume: 0.80
    pan: 0.0

generation:
  diversity: 0.25
  humanize: false
  chord_progression: "epic"
