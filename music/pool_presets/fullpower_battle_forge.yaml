name: "全能力量·战斗锻造 — Battle Forge"
version: "2.0"
bpm: 150
key: "Dm"
scale: "minor"
style: battle

instruments:
  - name: "Wavetable Brass Lead"
    role: melody
    engine: wavetable
    engine_params:
      preset: brass
    volume: 0.75
    pan: 0.0
    effect_chain:
      reverb_mix: 0.1
      reverb_decay: 0.8
      lp_filter_hz: 7000

  - name: "Subtractive Power Chords"
    role: chord
    engine: subtractive
    preset: "brass_section"
    volume: 0.55
    pan: -0.2
    effect_chain:
      reverb_mix: 0.15
      lp_filter_hz: 5000
      stereo_width: 0.4

  - name: "DX7 FM Bass"
    role: bass
    engine: fm_advanced
    engine_params:
      preset: dx7_bass
    volume: 0.8
    pan: 0.0
    effect_chain:
      reverb_mix: 0.05
      lp_filter_hz: 600

  - name: "Battle Drums"
    role: drum
    engine: noise
    volume: 0.85

  - name: "Waveguide Brass Pad"
    role: pad
    engine: waveguide
    engine_params:
      instrument: brass
    volume: 0.45
    pan: 0.3
    effect_chain:
      reverb_mix: 0.25
      reverb_decay: 1.5
      lp_filter_hz: 4000
      stereo_width: 0.6

  - name: "Granular Fire FX"
    role: fx
    engine: granular
    engine_params:
      preset: fire_crackle
    volume: 0.35
    pan: -0.3
    effect_chain:
      reverb_mix: 0.4
      reverb_decay: 2.0
      lp_filter_hz: 5000

automation:
  filter_sweep:
    start_hz: 400
    end_hz: 20000
    mid_hz: 20000
    q: 2.0
    mid_time_ratio: 0.2
    type: lowpass
    interpolate: smooth

generation:
  diversity: 0.45
  humanize: true
  chord_progression: "epic"
