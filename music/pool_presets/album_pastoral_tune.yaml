name: "田园小调 — 民谣/世界音乐"
version: "1.0"
bpm: 80
key: "C"
scale: "pentatonic"
style: exploration

instruments:
  - name: "Folk Theme"
    role: melody
    engine: wavetable
    preset: "acoustic_guitar_nylon"
    volume: 0.80
    pan: 0.0
    effect_chain:
      reverb_mix: 0.2
      reverb_decay: 1.0
      lp_filter_hz: 4500

  - name: "Folk Harmony"
    role: chord
    engine: wavetable
    preset: "acoustic_guitar_steel"
    volume: 0.50
    pan: -0.2
    effect_chain:
      reverb_mix: 0.25
      lp_filter_hz: 3500

  - name: "Pluck Bass"
    role: bass
    engine: karplus_strong
    preset: "plucked_string"
    volume: 0.65
    pan: 0.0
    octave: -1
    effect_chain:
      lp_filter_hz: 600

  - name: "Hand Percussion"
    role: drum
    engine: noise
    volume: 0.55
    pan: 0.0

generation:
  diversity: 0.3
  humanize: true
  chord_progression: "folk"
