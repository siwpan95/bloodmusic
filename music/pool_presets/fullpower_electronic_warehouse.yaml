name: "全能力量·电子仓库 — Electronic Warehouse"
version: "2.0"
bpm: 128
key: "Am"
scale: "minor"
style: electronic

instruments:
  - name: "Wavetable Organ Lead"
    role: melody
    engine: wavetable
    engine_params:
      preset: organ
    volume: 0.7
    pan: 0.0
    effect_chain:
      reverb_mix: 0.1
      lp_filter_hz: 8000

  - name: "Subtractive Saw Chords"
    role: chord
    engine: subtractive
    preset: "warm_pad"
    volume: 0.5
    pan: -0.2
    effect_chain:
      reverb_mix: 0.2
      lp_filter_hz: 6000
      stereo_width: 0.6

  - name: "FM Acid Bass"
    role: bass
    engine: fm
    engine_params:
      modulator_freq_ratio: 2.0
      fm_depth: 150
    volume: 0.75
    pan: 0.0
    effect_chain:
      reverb_mix: 0.05
      lp_filter_hz: 500

  - name: "EDM Drums"
    role: drum
    engine: noise
    volume: 0.7

  - name: "Granular Sci-Fi Pad"
    role: pad
    engine: granular
    engine_params:
      preset: sci_fi
    volume: 0.45
    pan: 0.3
    effect_chain:
      reverb_mix: 0.4
      reverb_decay: 2.0
      lp_filter_hz: 4000
      stereo_width: 0.8

  - name: "FM Advanced EP FX"
    role: fx
    engine: fm_advanced
    engine_params:
      preset: dx7_epiano
    volume: 0.3
    pan: -0.3
    effect_chain:
      reverb_mix: 0.4
      reverb_decay: 2.5
      lp_filter_hz: 5000

automation:
  filter_sweep:
    start_hz: 400
    end_hz: 20000
    mid_hz: 8000
    q: 3.0
    mid_time_ratio: 0.3
    type: lowpass
    interpolate: smooth

generation:
  diversity: 0.5
  humanize: true
  chord_progression: "epic"
