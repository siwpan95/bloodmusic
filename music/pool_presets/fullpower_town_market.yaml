name: "全能力量·城镇市集 — Town Market"
version: "2.0"
bpm: 105
key: "G"
scale: "major"
style: town

instruments:
  - name: "KS Nylon Guitar Melody"
    role: melody
    engine: karplus_strong
    engine_params:
      preset: nylon_guitar
    volume: 0.7
    pan: 0.1
    effect_chain:
      reverb_mix: 0.15
      reverb_decay: 0.8
      lp_filter_hz: 5000

  - name: "Waveguide Clarinet Chords"
    role: chord
    engine: waveguide
    engine_params:
      instrument: clarinet
    volume: 0.5
    pan: -0.1
    effect_chain:
      reverb_mix: 0.2
      reverb_decay: 1.0
      lp_filter_hz: 4000

  - name: "Wavetable Organ Bass"
    role: bass
    engine: wavetable
    engine_params:
      preset: organ
    volume: 0.6
    pan: 0.0
    octave: -1
    effect_chain:
      reverb_mix: 0.08
      lp_filter_hz: 500

  - name: "Town Drums"
    role: drum
    engine: noise
    volume: 0.55

  - name: "Subtractive Warm Pad"
    role: pad
    engine: subtractive
    preset: "warm_pad"
    volume: 0.4
    pan: 0.25
    effect_chain:
      reverb_mix: 0.35
      reverb_decay: 2.0
      lp_filter_hz: 3000
      stereo_width: 0.6

  - name: "FM Advanced Bell FX"
    role: fx
    engine: fm_advanced
    engine_params:
      preset: dx7_bell
    volume: 0.3
    pan: -0.25
    effect_chain:
      reverb_mix: 0.4
      reverb_decay: 2.5
      lp_filter_hz: 5000

generation:
  diversity: 0.3
  humanize: true
  chord_progression: "I-IV-V-I"
