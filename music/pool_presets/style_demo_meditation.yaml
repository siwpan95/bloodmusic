name: "静水流深 — 冥想/自然"
version: "1.0"
bpm: 60
key: "C"
scale: "pentatonic"
style: meditation

instruments:
  - name: "Ethereal Harp"
    role: melody
    engine: karplus_strong
    preset: "harp"
    volume: 0.55
    pan: 0.0
    effect_chain:
      reverb_mix: 0.60
      reverb_decay: 3.5
      lp_filter_hz: 5000

  - name: "Ambient Pad"
    role: chord
    engine: granular
    preset: "pad"
    volume: 0.40
    pan: 0.3
    effect_chain:
      reverb_mix: 0.60
      reverb_decay: 4.0
      lp_filter_hz: 2000

  - name: "Warm Bass"
    role: bass
    engine: subtractive
    preset: "warm"
    volume: 0.45
    pan: 0.0
    octave: -1
    effect_chain:
      reverb_mix: 0.50
      lp_filter_hz: 300

generation:
  diversity: 0.1
  humanize: true
  chord_progression: "dreamy"
