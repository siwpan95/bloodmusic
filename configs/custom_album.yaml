# P0-2: 自定义专辑 YAML（5 曲目，5 种风格）
album:
  title: 自定义专辑 — 风格探索
  artist: BloodMusic Engine
  genre: soundtrack
  year: 2026
  cover: null

instrument_pool:
  name: 自定义多风格乐池
  bpm: 120
  key: C
  scale: major
  global_volume: 0.9
  generation:
    diversity: 0.5
    humanize: true
    seed: 2026
    chord_progression: dreamy
  instruments:
  # 旋律组
  - name: 钢琴主旋律
    role: melody
    engine: wavetable
    preset: acoustic_grand_piano
    volume: 0.85
    pan: 0.1
  # 和弦组
  - name: 弦乐铺底
    role: chord
    engine: fm_advanced
    preset: warm_pad
    volume: 0.7
    pan: -0.2
  - name: 铜管和弦
    role: chord
    engine: subtractive
    preset: brass_section
    volume: 0.6
    pan: 0.2
  # 低音组
  - name: 低音贝斯
    role: bass
    engine: subtractive
    preset: deep_bass
    volume: 0.95
    pan: 0.0
  # 打击组
  - name: 鼓组
    role: drum
    engine: noise
    volume: 0.85
    pan: 0.0
  # 氛围组
  - name: 空灵铺底
    role: pad
    engine: granular
    preset: bright_pad
    volume: 0.5
    pan: 0.3
  # 特效组
  - name: 特效合成器
    role: fx
    engine: karplus_strong
    preset: synth_lead
    volume: 0.4
    pan: -0.4

mix_config:
  clip_mode: soft
  normalize_mode: rms
  rms_target_db: -2.0
  fade_in_ms: 80
  fade_out_ms: 300
  compress: true
  compress_threshold: -18.0
  compress_ratio: 3.0

separate_mode: manifest

tracks:
# 1 — 冥想氛围（慢速、空灵）
- title: 冥想 · 晨曦
  bpm: 60
  bars: 24
  key: C
  style: meditation
  seed: 100

# 2 — 爵士咖啡馆（中速、swing feel）
- title: 爵士 · 午后
  bpm: 110
  bars: 32
  key: F
  style: jazz
  seed: 200

# 3 — 地下城探险（阴暗、紧张）
- title: 地下城 · 深渊
  bpm: 95
  bars: 20
  key: Dm
  style: dungeon
  seed: 300

# 4 — 影视史诗（宏大、渐进）
- title: 史诗 · 崛起
  bpm: 85
  bars: 28
  key: Gm
  style: cinematic
  seed: 400

# 5 — Lo-Fi 学习（温暖、松弛）
- title: Lo-Fi · 夜读
  bpm: 75
  bars: 32
  key: Am
  style: lofi
  seed: 500
