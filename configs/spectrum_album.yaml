# SPECTRUM 《频谱万象》— 自生成多风格漫游
# 概念（基于 2026 联网调研）：在流派融合、流派碎片化、情绪即流派的时代，
# 用一张专辑完成一次"统一中的多样"旅程——所有曲目共享同一套 6 引擎核心乐池
# （统一性），再各自被风格预设与逐曲混音重塑（多样性），形成连贯的情绪弧线。
#
# 功能覆盖：
#  - 12 个风格预设全覆盖（meditation/ambient/classical/folk/town/jazz/lofi/
#    exploration/electronic/cinematic/battle/dungeon）
#  - 基础乐池 6 种合成引擎（wavetable / fm_advanced / subtractive /
#    karplus_strong / granular / noise）+ 逐曲 extra_instruments
#  - 【v2.3 新引擎并入】P1 的 8 件加法/模态合成乐器（glass_bell / metal_bell /
#    metal_plate / glass_pad / marimba_bar / tubular_bell_modal / singing_bowl /
#    gong_modal，engine=additive/modal）作为逐曲音色色彩织入专辑，
#    全部 8 件均被渲染（见各曲 extra_instruments）
#  - 逐曲 mix_config_override 塑造情绪（低通/高通/压缩/RMS 目标）
#  - separate_mode=manifest 导出分轨（多轨可见）
album:
  title: SPECTRUM 频谱万象
  artist: BloodMusic Engine
  genre: multi-style / genre-fluid
  year: 2026
  cover: null

# ── 统一核心乐池（6 引擎，每曲共享 → 统一音色基底）──
instrument_pool:
  name: SPECTRUM 核心乐池
  bpm: 120
  key: C
  scale: major
  global_volume: 0.85
  generation:
    diversity: 0.4
    humanize: true
    seed: 2026
  instruments:
  # 旋律 — 波表合成
  - name: 主旋律
    role: melody
    engine: wavetable
    preset: synth_lead
    volume: 0.85
    pan: 0.1
  # 和弦 — FM 多算子合成
  - name: 和弦铺底
    role: chord
    engine: fm_advanced
    preset: warm_pad
    volume: 0.65
    pan: -0.2
  # 低音 — 减法合成
  - name: 低音贝斯
    role: bass
    engine: subtractive
    preset: deep_bass
    volume: 0.9
    pan: 0.0
  # 打击 — 噪声合成（鼓专用）
  - name: 鼓组
    role: drum
    engine: noise
    volume: 0.85
    pan: 0.0
  # 铺底 — 粒子合成
  - name: 氛围铺底
    role: pad
    engine: granular
    preset: bright_pad
    volume: 0.45
    pan: 0.3
  # 特效 — Karplus-Strong 物理建模
  - name: 拨弦特效
    role: fx
    engine: karplus_strong
    preset: harpsichord
    volume: 0.4
    pan: -0.4

# ── 专辑级混音默认 ──
mix_config:
  clip_mode: soft
  normalize_mode: rms
  rms_target_db: -16.0
  fade_in_ms: 60
  fade_out_ms: 250
  compress: true
  compress_threshold: -18.0
  compress_ratio: 3.0

separate_mode: manifest

tracks:
