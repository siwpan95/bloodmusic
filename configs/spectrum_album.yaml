    rms_target_db: -22.0
    compress: false
    low_pass_cutoff: 8000
  extra_instruments:
  - {name: 空灵铺, role: pad, engine: granular, preset: bright_pad, volume: 0.5, pan: 0.3}
  - {name: 鲁特, role: fx, engine: karplus_strong, preset: acoustic_guitar_nylon, volume: 0.4, pan: -0.3}
  - {name: 玻璃铃, role: fx, engine: additive, engine_params: {preset: glass}, volume: 0.3, pan: 0.3}
